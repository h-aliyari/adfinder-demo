<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- پترن گرید -->
    <pattern id="grid-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    </pattern>
    
    <!-- گرادیان مرکزی -->
    <radialGradient id="center-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  
  <!-- پس‌زمینه گرید -->
  <rect width="100%" height="100%" fill="url(#grid-pattern)"/>
  
  <!-- گرادیان مرکزی -->
  <circle cx="50%" cy="50%" r="50%" fill="url(#center-gradient)"/>
</svg>